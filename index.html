.topbar::after{
  content:"";
  position:absolute; right:-30px; top:-30px; width:140px; height:140px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(231,184,78,.28), transparent 70%);
}
.crew-eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 4px;}
.brand-row{display:flex; align-items:center; gap:12px;}
.crew-logo{width:54px; height:54px; border-radius:50%; background:#fff; padding:3px; box-shadow:0 2px 10px rgba(0,0,0,.28); flex-shrink:0; object-fit:contain;}
.crew-title{font-size:18.5px; font-weight:700; margin:0; letter-spacing:-.01em; line-height:1.3;}
.crew-sub{font-size:12.5px; color:rgba(255,255,255,.62); margin:6px 0 0;}
.session-row{display:flex; justify-content:flex-end; margin:14px 16px 0;}
.session-chip{
  font-size:11.5px; color:var(--ink); background:var(--card); font-weight:600;
  padding:6px 12px; border-radius:20px; cursor:pointer; border:1px solid var(--line);
  display:flex; align-items:center; gap:6px; box-shadow:var(--shadow);
}
.session-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}

/* tabs */
.tabs{
  display:flex; gap:2px; margin:10px 16px 0; background:var(--card);
  border-radius:14px; padding:4px; box-shadow:var(--shadow); border:1px solid var(--line);
}
.tab-btn{
  flex:1; border:none; background:transparent; padding:10px 4px; font-size:13.5px; font-weight:600;
  color:var(--ink-soft); border-radius:10px; cursor:pointer; font-family:inherit;
}
.tab-btn.active{background:var(--ink); color:#fff;}

main#app{padding:16px 16px 4px;}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
}
.card h3{margin:0 0 4px; font-size:15.5px; font-weight:700;}
.section-title{
  font-size:13px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;
  margin:22px 2px 10px; display:flex; align-items:center; justify-content:space-between;
}
.empty{
  text-align:center; padding:30px 16px; color:var(--ink-soft); font-size:13.5px;
  border:1.5px dashed var(--line); border-radius:var(--radius);
}
.empty .track{width:46px;height:46px;margin:0 auto 10px;opacity:.5;}

/* buttons */
.btn{
  font-family:inherit; font-weight:600; font-size:13.5px; border-radius:10px; border:none;
  padding:9px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
}
.btn-primary{background:var(--ink); color:#fff;}
.btn-accent{background:var(--accent); color:var(--accent-ink);}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn-coral{background:#FFEDE7; color:#C8461F;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}
.btn-block{width:100%; justify-content:center;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.fab{
  position:sticky; bottom:14px; margin:16px auto 0; display:block;
}

/* calendar */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.cal-nav{background:transparent; border:none; font-size:16px; cursor:pointer; color:var(--ink-soft); padding:4px 10px;}
.cal-title{font-weight:700; font-size:15px;}
.cal-today{font-size:11.5px; color:var(--river); background:#E8EDF6; padding:5px 10px; border-radius:8px; border:none; cursor:pointer; font-weight:600;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
.cal-dow{font-size:11px; color:var(--ink-soft); padding:4px 0 8px; font-weight:600;}
.cal-cell{
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:10px; font-size:12.5px; cursor:pointer; position:relative; color:var(--ink);
}
.cal-cell.pad{color:#C7C4B6; cursor:default;}
.cal-cell.today{outline:1.5px solid var(--ink);}
.cal-cell.holiday{color:#D64545;}
.cal-cell.saturday{color:#2F6FE0;}
.cal-cell.selected.holiday, .cal-cell.selected.saturday{color:#fff;}
.cal-cell.selected{background:var(--ink); color:#fff;}
.cal-mark{width:5px; height:5px; border-radius:1px; transform:rotate(45deg); background:var(--river); margin-top:3px;}
.cal-cell.selected .cal-mark{background:var(--accent);}

/* meetup card */
.meetup{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
}
.meetup-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.meetup-title{font-weight:700; font-size:14.5px; margin:0 0 4px;}
.meetup-meta{font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
.badge{font-size:11px; font-weight:700; padding:4px 8px; border-radius:7px; white-space:nowrap;}
.badge-open{background:#E8EDF6; color:var(--river);}
.badge-full{background:#FDEDE7; color:var(--coral);}
.badge-past{background:#EDECE4; color:var(--ink-soft);}
.meetup-actions{display:flex; gap:8px; margin-top:10px;}

/* members */
.member-row{display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--line);}
.member-row:last-child{border-bottom:none;}
.member-name{font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px;}
.role-badge{font-size:10px; font-weight:700; background:var(--ink); color:#fff; padding:2px 6px; border-radius:6px;}
.member-actions{display:flex; gap:6px;}

/* forms */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field input, .field textarea, .field select{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px;
  font-family:inherit; background:#FCFCFA; color:var(--ink);
}
.field textarea{resize:vertical; min-height:80px;}
.field textarea.tall{min-height:240px;}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent); border-color:transparent;}
.row2{display:flex; gap:10px;}
.row2 .field{flex:1;}

/* modal */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(22,36,28,.45); display:flex; align-items:flex-end; justify-content:center;
  z-index:50; animation:fade .15s ease;
}
@keyframes fade{from{opacity:0} to{opacity:1}}
.modal-sheet{
  background:var(--bg); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:20px 20px 26px;
  max-height:88vh; overflow-y:auto; animation:up .18s ease;
}
@keyframes up{from{transform:translateY(24px); opacity:.5} to{transform:translateY(0); opacity:1}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-head h2{font-size:16.5px; margin:0;}
.modal-close{background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-soft); padding:4px;}

/* toast */
#toast-root{position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--ink); color:#fff; padding:11px 18px; border-radius:30px; font-size:13px; box-shadow:var(--shadow); animation:up .18s ease;}

/* mypage */
.profile-card{
  background:linear-gradient(135deg, var(--ink), #223227); color:#fff; border-radius:var(--radius); padding:18px;
  margin-bottom:16px; position:relative; overflow:hidden;
}
.profile-name{font-size:17px; font-weight:700;}
.profile-phone{font-size:12.5px; color:rgba(255,255,255,.68); margin-top:4px;}
.tag-row{display:flex; gap:8px; margin-top:12px;}
.pill{font-size:11px; background:rgba(255,255,255,.14); padding:5px 10px; border-radius:20px;}

.req-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
.p-table-head{display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:11px; font-weight:700; color:var(--ink-soft); border-bottom:1px solid var(--line);}
.p-table-head .col-name{flex:1.3;}
.p-table-head .col-sub{flex:1.5;}
.p-table-head .col-att{flex:0.8; text-align:right;}
.p-table-row{display:flex; align-items:center; gap:8px; padding:9px 4px 2px; font-size:12.5px;}
.p-table-row .col-name{flex:1.3; font-weight:600; cursor:pointer;}
.p-table-row .col-sub{flex:1.5; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.p-table-row .col-att{flex:0.8; text-align:right;}
.req-row:last-child{border-bottom:none;}
.req-name{font-size:13.5px; font-weight:600;}
.req-sub{font-size:11.5px; color:var(--ink-soft);}

.link-btn{background:none; border:none; color:var(--river); font-size:12.5px; font-weight:600; cursor:pointer; padding:0; font-family:inherit;}
.helper{font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
.auth-toggle{display:flex; gap:8px; margin-bottom:16px;}
.auth-toggle button{flex:1;}

/* feed */
.post-avatar{width:34px; height:34px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;}
.post-header{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.post-author{font-weight:700; font-size:13.5px;}
.post-time{font-size:11.5px; color:var(--ink-soft);}
.post-content{font-size:13.5px; line-height:1.6; white-space:pre-wrap; margin:0 0 10px;}
.post-image{width:100%; border-radius:12px; margin-bottom:10px; display:block; max-height:520px; object-fit:contain; background:#EDEFF3;}
.post-actions-row{display:flex; gap:14px; align-items:center; border-top:1px solid var(--line); padding-top:10px; margin-top:2px;}
.like-btn{background:none; border:none; cursor:pointer; font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; font-family:inherit; font-weight:600;}
.like-btn.liked{color:var(--coral);}
.comment-list{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
.comment-item{background:#F6F7FA; border-radius:10px; padding:8px 10px; font-size:12.5px; line-height:1.5;}
.comment-author{font-weight:700; margin-right:6px;}
.comment-form{display:flex; gap:6px; margin-top:10px;}
.comment-form input{flex:1; border:1.5px solid var(--line); border-radius:20px; padding:8px 12px; font-size:12.5px; font-family:inherit;}
.image-preview{width:100%; border-radius:12px; margin-top:8px; max-height:220px; object-fit:cover; display:none;}
.file-btn{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--river); cursor:pointer; font-weight:600; margin-top:4px;}

/* footer */
.app-footer{ text-align:center; padding:30px 24px 26px; }
.footer-divider{ height:1px; background:var(--line); margin:0 0 20px; }
.footer-brand{ font-size:10.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.1em; text-transform:uppercase; margin:0 0 8px; }
.footer-credit{ font-size:12px; color:var(--ink); margin:0 0 5px; }
.footer-credit b{ font-weight:700; }
.footer-contact{ font-size:11.5px; color:var(--ink-soft); margin:0 0 12px; }
.footer-contact a{ color:var(--river); text-decoration:none; font-weight:600; }
.footer-copy{ font-size:10px; color:#B0B6C2; margin:0; letter-spacing:.02em; }
</style>
</head>

const db = firebase.firestore();
// 마지막으로 Firestore와 동기화된 상태의 스냅샷 (변경분만 골라 쓰기 위한 캐시)
const fsCache = { members: {}, notices: {}, meetups: {}, requests: {}, posts: {} };

async function loadCollection(name){
  const snap = await db.collection(name).get();
  const arr = [];
  snap.forEach(doc => {
    const data = { id: doc.id, ...doc.data() };
    arr.push(data);
    fsCache[name][doc.id] = JSON.parse(JSON.stringify(data));
  });
  return arr;
}

// state.X 배열을 Firestore와 비교해서, 실제로 달라지거나 삭제된 문서만 씀 (쓰기 횟수 최소화)
async function syncCollection(name, arr){
  const col = db.collection(name);
  const remaining = new Set(Object.keys(fsCache[name]));
  const batch = db.batch();
  let ops = 0;
  arr.forEach(item => {
    const prev = fsCache[name][item.id];
    if(!prev || JSON.stringify(prev) !== JSON.stringify(item)){
      batch.set(col.doc(item.id), item);
      ops++;
    }
    remaining.delete(item.id);
  });
  remaining.forEach(id => { batch.delete(col.doc(id)); ops++; });
  if(ops > 0) await batch.commit();
  fsCache[name] = {};
  arr.forEach(item => { fsCache[name][item.id] = JSON.parse(JSON.stringify(item)); });
}

async function saveMembers(){ try{ await syncCollection('members', state.members); }catch(e){ console.error(e); showToast('저장 실패, 다시 시도해주세요'); } }

async function doRegister(name, intro, batch, phone, pin, hint){
  name = name.trim();
  phone = normalizePhone(phone);
  hint = (hint||'').trim();
  if(!name || !/^\d{9,11}$/.test(phone) || !/^\d{4}$/.test(pin) || !hint){
    showToast('이름 · 휴대폰 번호(- 없이) · PIN · 힌트 답을 모두 확인해주세요');
    return;
  }
  if(state.members.some(m => m.phone === phone)){
    showToast('이미 등록된 연락처예요. 로그인을 이용해주세요');
    return;
  }
  const member = {
    id: uid(),
    name,
    intro: intro.trim(),
    batch: batch.trim(),
    phone,
    pin,
    hint,
    role: 'member', // 최종 값은 아래 트랜잭션에서 결정 (동시 가입 시 관리자 중복 방지)
    joinedAt: ymd(new Date()),
  };
  try{
    const metaRef = db.collection('meta').doc('bootstrap');
    const memberRef = db.collection('members').doc(member.id);
    await db.runTransaction(async (tx) => {
      const metaSnap = await tx.get(metaRef);
      const adminCreated = metaSnap.exists && metaSnap.data().adminCreated;
      if(!adminCreated){
        member.role = 'admin';
        tx.set(metaRef, { adminCreated: true, adminId: member.id }, { merge: true });
      }
      tx.set(memberRef, member);
    });
  }catch(e){
    console.error(e);
    showToast('가입 처리 중 오류가 발생했어요. 다시 시도해주세요');
    return;
  }
  state.members.push(member);
  fsCache.members[member.id] = JSON.parse(JSON.stringify(member));
  state.session = { memberId: member.id };
  saveSession();
  closeModal();
  showToast(member.role === 'admin' ? '첫 가입자는 자동으로 플랫폼관리자가 됐어요' : `${name}님, 환영해요!`);
  renderAll();
}

function exportYearlyReport(){

    { 항목: '총 공지 수', 값: state.notices.length },
    { 항목: '총 소식 수', 값: state.posts.length },
    { 항목: '추출일', 값: ymd(new Date()) },
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), '요약');

  const meetupRows = [...state.meetups].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(mt => ({
    '모임이름': mt.title,
    '일시': `${mt.date} ${mt.time}`,
    '장소': mt.location,
    '확정인원': mt.participants.filter(p=>p.status==='confirmed').length,
    '대기인원': mt.participants.filter(p=>p.status==='waiting').length,
    '실제출석': mt.participants.filter(p=>p.attended).length,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(meetupRows), '모임목록');

  const memberRows = state.members.map(m => ({
    '이름': m.name,
    '기수': m.batch || '',
    '연락처': maskPhone(m.phone),
    '설명': m.intro || '',
    '가입일': m.joinedAt,
    '권한': m.role === 'admin' ? '플랫폼관리자' : '동문',
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(memberRows), '회원목록');

  XLSX.writeFile(wb, `총동문회_연간리포트_${ymd(new Date())}.xlsx`);
  showToast('연간 리포트를 다운로드했어요');
}

function saveEditedMeetup(id){
  const mt = state.meetups.find(m => m.id === id);
  if(!mt) return;
  const title = document.getElementById('editMtTitle').value.trim();
  const date = document.getElementById('editMtDate').value;
  const time = document.getElementById('editMtTime').value;
  const location = document.getElementById('editMtLocation').value.trim();
  const capacity = Number(document.getElementById('editMtCapacity').value) || 0;
  const mapUrl = document.getElementById('editMtMapUrl').value.trim();
  const subgroup = document.getElementById('editMtSubgroup').value.trim();
  const info = document.getElementById('editMtInfo').value.trim();
  if(!title || !date || !time || !location){ showToast('모임 이름 · 일시 · 장소는 꼭 입력해주세요'); return; }
  mt.title = title; mt.date = date; mt.time = time; mt.location = location; mt.capacity = capacity;
  mt.mapUrl = mapUrl; mt.subgroups = subgroup.split('\n').map(s=>s.trim()).filter(Boolean); mt.info = info; mt.image = pendingPostImage;
  if(capacity > 0){
    const confirmed = mt.participants.filter(p => p.status === 'confirmed').sort((a,b)=>a.appliedAt-b.appliedAt);
    confirmed.forEach((p, i) => { p.status = i < capacity ? 'confirmed' : 'waiting'; });
  }
  pendingPostImage = null;
  saveMeetups();
  closeModal();
  showToast('모임 정보를 수정했어요');
  renderAll();
}
function confirmedCount(mt){ return mt.participants.filter(p => p.status === 'confirmed').length; }
function myStatusIn(mt){
  const me = currentMember();
  if(!me) return null;
  const p = mt.participants.find(p => p.memberId === me.id);
  return p ? p.status : null;
}
function getSubgroups(mt){
  if(Array.isArray(mt.subgroups)) return mt.subgroups.filter(Boolean);
  if(mt.subgroup) return [mt.subgroup];
  return [];
}
function openJoinModal(id){
  if(!requireLogin()) return;
  const mt = state.meetups.find(m => m.id === id);
  if(!mt) return;
  const groups = getSubgroups(mt);
  openModal('참여 신청', `
    <p class="helper">${mt.title}</p>
    <div class="field"><label>신청 항목을 선택해주세요</label>
      <select id="joinSubgroup">
        ${groups.map(g => `<option value="${g.replace(/"/g,'&quot;')}">${g}</option>`).join('')}
      </select>
    </div>
    <button class="btn btn-accent btn-block" onclick="joinMeetup('${id}', document.getElementById('joinSubgroup').value)">신청하기</button>
  `);
}
function joinMeetup(id, subgroup){
  if(!requireLogin()) return;
  const me = currentMember();
  const mt = state.meetups.find(m => m.id === id);
  if(!mt) return;
  if(mt.participants.some(p => p.memberId === me.id)){ showToast('이미 신청했어요'); return; }
  const full = mt.capacity > 0 && confirmedCount(mt) >= mt.capacity;
  mt.participants.push({ memberId: me.id, status: full ? 'waiting' : 'confirmed', appliedAt: Date.now(), wasWaiting: full, notifiedPromotion: true, subgroup: subgroup || null, attended: false });
  saveMeetups();
  closeModal();
  showToast(full ? '정원이 가득 차 대기로 신청됐어요' : '신청 완료! 그날 뵈어요');
  renderAll();
}
function cancelMeetup(id){
  const me = currentMember();
  const mt = state.meetups.find(m => m.id === id);
  if(!mt || !me) return;
  const wasConfirmed = mt.participants.some(p => p.memberId === me.id && p.status === 'confirmed');
  mt.participants = mt.participants.filter(p => p.memberId !== me.id);
  if(wasConfirmed){
    const waiting = mt.participants.filter(p => p.status === 'waiting').sort((a,b)=>a.appliedAt-b.appliedAt);
    if(waiting.length){ waiting[0].status = 'confirmed'; waiting[0].notifiedPromotion = false; showToast('취소 완료, 대기자 한 분이 확정됐어요'); }
    else showToast('신청을 취소했어요');
  } else {
    showToast('신청을 취소했어요');
  }
  saveMeetups();
  renderAll();
}
function checkMyPromotions(){
  const me = currentMember();
  if(!me) return;
  let changed = false;
  state.meetups.forEach(mt => {
    const p = mt.participants.find(x => x.memberId === me.id);
    if(p && p.wasWaiting && p.status === 'confirmed' && p.notifiedPromotion === false){
      showToast(`"${mt.title}" 모임, 대기 신청이 확정으로 바뀌었어요! 🎉`);
      p.notifiedPromotion = true;
      changed = true;
    }
  });
  if(changed) saveMeetups();
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
function attendanceWindowOpen(mt){
  const [y,m,d] = mt.date.split('-').map(Number);
  const [hh,mm] = mt.time.split(':').map(Number);
  const start = new Date(y, m-1, d, hh, mm).getTime();
  const now = Date.now();
  return now >= start - 60*60*1000; // 모임 시작 1시간 전부터 오픈
}
function checkInWithCode(meetupId, code){
  const me = currentMember();
  if(!me) return;
  const mt = state.meetups.find(m => m.id === meetupId);
  if(!mt) return;
  const p = mt.participants.find(x => x.memberId === me.id);
  if(!p){ showToast('신청 내역이 없어요'); return; }
  if(!attendanceWindowOpen(mt)){ showToast('출석체크는 모임 1시간 전부터 가능해요'); return; }
  if(code.trim() !== mt.attendanceCode){ showToast('출석 코드가 일치하지 않아요'); return; }
  p.attended = true;
  p.attendedAt = Date.now();
  saveMeetups();
  showToast('출석 확인됐어요, 반가워요! 🙌');
  renderApp();
}
function toggleAttendance(meetupId, memberId){
  const mt = state.meetups.find(m => m.id === meetupId);
  if(!mt) return;
  const p = mt.participants.find(x => x.memberId === memberId);
  if(!p) return;
  p.attended = !p.attended;
  if(p.attended) p.attendedAt = Date.now();
  saveMeetups();
  showToast(p.attended ? '출석 처리했어요' : '출석을 취소했어요');
  const modalRoot = document.getElementById('modal-root');
  if(modalRoot.innerHTML) openParticipantsModal(meetupId);
}

function requestContact(targetId){
  if(!requireLogin()) return;
  const me = currentMember();
  if(me.id === targetId) return;
  const exists = state.requests.find(r => r.fromId === me.id && r.toId === targetId && r.status !== 'declined');
  if(exists){ showToast('이미 요청을 보냈어요'); return; }
  state.requests.push({ id: uid(), fromId: me.id, toId: targetId, status: 'pending', createdAt: Date.now() });
  saveRequests();
  showToast('연락처 공개를 요청했어요');
  renderAll();
}
function respondRequest(reqId, accept){
  const r = state.requests.find(x => x.id === reqId);
  if(!r) return;
  r.status = accept ? 'accepted' : 'declined';
  saveRequests();
  showToast(accept ? '수락했어요, 서로 연락처가 열렸어요' : '거절했어요');
  renderAll();
}
function contactStateWith(otherId){
  const me = currentMember();
  if(!me) return { state:'none' };
  if(me.role === 'admin') return { state:'accepted' }; // 플랫폼관리자는 옴니 모드: 항상 연락처 공개
  const mine = state.requests.find(r => r.fromId === me.id && r.toId === otherId && r.status !== 'declined');
  const theirs = state.requests.find(r => r.fromId === otherId && r.toId === me.id && r.status !== 'declined');
  const accepted = (mine && mine.status === 'accepted') || (theirs && theirs.status === 'accepted');
  if(accepted) return { state:'accepted' };
  if(mine && mine.status === 'pending') return { state:'sent' };
  if(theirs && theirs.status === 'pending') return { state:'incoming', reqId: theirs.id };
  return { state:'none' };
}

function handleImageSelect(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingPostImage = canvas.toDataURL('image/jpeg', 0.72);
      const prev = document.getElementById('postImagePreview');
      if(prev){ prev.src = pendingPostImage; prev.style.display = 'block'; }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function fmtTimeAgo(ts){
  const diff = Math.floor((Date.now() - ts) / 1000);
  if(diff < 60) return '방금 전';
  if(diff < 3600) return Math.floor(diff/60) + '분 전';
  if(diff < 86400) return Math.floor(diff/3600) + '시간 전';
  if(diff < 604800) return Math.floor(diff/86400) + '일 전';
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function renderCalendar(){
  const cm = state.calMonth;
  const y = cm.getFullYear(), m = cm.getMonth();
  const first = new Date(y, m, 1);
  const startPad = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=startPad-1; i>=0; i--) cells.push({d: daysInPrev-i, pad:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, pad:false, dateStr: `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length % 7 !== 0) cells.push({d: cells.length, pad:true});

  const todayStr = ymd(new Date());
  const eventDates = new Set(state.meetups.map(mt => mt.date));

  return `
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <span class="cal-title disp">${y}년 ${m+1}월</span>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map((c, idx) => {
          if(c.pad) return `<div class="cal-cell pad">${c.d}</div>`;
          const isToday = c.dateStr === todayStr;
          const isSel = c.dateStr === state.selectedDate;
          const hasEvent = eventDates.has(c.dateStr);
          const hName = holidayName(c.dateStr);
          const col = idx % 7; // 0=일요일 ... 6=토요일
          const dowClass = hName || col === 0 ? 'holiday' : (col === 6 ? 'saturday' : '');
          return `<div class="cal-cell ${dowClass} ${isToday?'today':''} ${isSel?'selected':''}" onclick="selectDate('${c.dateStr}')" ${hName ? `title="${hName}"` : ''}>
            <span>${c.d}</span>${hasEvent ? '<span class="cal-mark"></span>' : ''}
          </div>`;
        }).join('')}
      </div>
      <button class="cal-today" style="margin-top:10px;" onclick="goToday()">오늘</button>
    </div>
  `;
}
function changeMonth(delta){
  const d = state.calMonth;
  state.calMonth = new Date(d.getFullYear(), d.getMonth()+delta, 1);
  renderApp();
}
function goToday(){
  state.calMonth = startOfMonth(new Date());
  state.selectedDate = ymd(new Date());
  renderApp();

        <div>
          <p class="meetup-title" onclick="openParticipantsModal('${mt.id}')" style="cursor:pointer;">${mt.title}</p>
          ${groups.length ? groups.map(g=>`<span class="badge badge-open" style="margin:2px 4px 6px 0; display:inline-block;">${g}</span>`).join('') : ''}
          <p class="meetup-meta">
            📅 ${fmtDateKR(mt.date)} · ${mt.time}<br>
            📍 ${mt.location}${mt.mapUrl ? ` · <a href="${mt.mapUrl}" target="_blank" rel="noopener" class="link-btn">지도보기</a>` : ''}<br>
            👥 ${confirmed}${mt.capacity>0 ? '/'+mt.capacity : '명'} 참여${mt.participants.filter(p=>p.status==='waiting').length ? ` · 대기 ${mt.participants.filter(p=>p.status==='waiting').length}명` : ''}
          </p>
          ${mt.info ? `<p class="post-content" style="margin-top:8px;">${mt.info.replace(/\n/g,'<br>')}</p>` : ''}
          ${confirmed ? `<p class="meetup-meta" style="margin-top:6px;">🙋 ${previewList}${moreCount>0 ? ` 외 ${moreCount}명` : ''} · <button class="link-btn" onclick="openParticipantsModal('${mt.id}')">참가자 보기</button></p>` : ''}
        </div>
        ${badge}
      </div>
      <div class="meetup-actions">${actions}</div>
    </div>
  `;
}

function meetupCardCompact(mt){
  const isPast = mt.date < ymd(new Date());
  return `
    <div class="meetup" style="cursor:pointer; display:flex; gap:12px; align-items:center;" onclick="openMeetupDetailModal('${mt.id}')">
      ${mt.image ? `<img src="${mt.image}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;">` : `<div style="width:56px;height:56px;border-radius:10px;background:#EDEFF3;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;">${isPast ? '🏁' : '📅'}</div>`}
      <div style="min-width:0; flex:1;">
        <p class="meetup-title" style="margin:0 0 3px; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${mt.title}</p>
        <p class="meetup-meta" style="margin:0;">${fmtDateKR(mt.date)} · ${mt.time}</p>
      </div>
    </div>
  `;
}
function openMeetupDetailModal(id){
  const mt = state.meetups.find(m => m.id === id);
  if(!mt) return;
  openModal('모임 상세', meetupCard(mt));
}
function renderScheduleTab(){
  const selected = state.selectedDate;
  const selMeetups = state.meetups.filter(mt => mt.date === selected).sort((a,b)=>a.time.localeCompare(b.time));
  const upcoming = state.meetups.filter(mt => mt.date >= ymd(new Date())).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  const past = state.meetups.filter(mt => mt.date < ymd(new Date())).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));

  return `
    ${renderCalendar()}
    ${canPost() ? `<button class="btn btn-primary btn-block fab" onclick="openMeetupModal()">+ 모임 만들기</button>` : ''}

    <div class="section-title">${fmtDateKR(selected)}${holidayName(selected) ? ' · 🎌 '+holidayName(selected) : ''}</div>
    ${selMeetups.length ? selMeetups.map(meetupCardCompact).join('') : `<div class="empty">이 날은 예정된 모임이 없어요</div>`}

    <div class="section-title">다가오는 모임</div>
    ${upcoming.length ? upcoming.map(meetupCardCompact).join('') : `<div class="empty">다가오는 모임이 없어요, 첫 모임을 만들어보세요</div>`}

    <div class="section-title">지난 모임</div>
    ${past.length ? past.slice(0,10).map(meetupCardCompact).join('') : `<div class="empty">지난 모임이 없어요</div>`}
  `;
}

function renderMembersTab(){
  const admin = isAdmin();
  const list = [...state.members].sort((a,b)=> a.role===b.role ? a.name.localeCompare(b.name) : (a.role==='admin'?-1:1));
  const thisMonth = ymd(new Date()).slice(0,7);
  const stats = admin ? {
    총회원: state.members.length,
    이번달신규: state.members.filter(m => m.joinedAt.slice(0,7) === thisMonth).length,
    총모임: state.meetups.length,
    이번달모임: state.meetups.filter(mt => mt.date.slice(0,7) === thisMonth).length,
    누적참석: state.meetups.reduce((s,mt)=>s+mt.participants.filter(p=>p.status==='confirmed').length,0),
    총공지: state.notices.length,
    총소식: state.posts.length,
  } : null;
  return `
    <div class="card">
      <h3>동문 ${state.members.length}명</h3>
      <p class="meetup-meta">함께하는 우리 동문들</p>
    </div>
    ${admin ? `
    <div class="section-title">운영 현황</div>
    <div class="card" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; text-align:center;">
      <div><div class="disp" style="font-size:20px; font-weight:800;">${stats.총회원}</div><div class="req-sub">전체 동문</div></div>
      <div><div class="disp" style="font-size:20px; font-weight:800;">${stats.이번달신규}</div><div class="req-sub">이번달 신규</div></div>
      <div><div class="disp" style="font-size:20px; font-weight:800;">${stats.총모임}</div><div class="req-sub">전체 모임</div></div>
      <div><div class="disp" style="font-size:20px; font-weight:800;">${stats.이번달모임}</div><div class="req-sub">이번달 모임</div></div>
      <div><div class="disp" style="font-size:20px; font-weight:800;">${stats.누적참석}</div><div class="req-sub">누적 참석(연인원)</div></div>
      <div><div class="disp" style="font-size:20px; font-weight:800;">${stats.총공지+stats.총소식}</div><div class="req-sub">공지+소식</div></div>
    </div>
    <button class="btn btn-ghost btn-block" onclick="exportYearlyReport()">📊 연간 리포트 엑셀 다운로드</button>
    <button class="btn btn-ghost btn-block" onclick="exportAllData()">⬇ 전체 데이터 백업(내보내기)</button>
    ` : ''}
    <div class="card" style="padding:4px 16px;">
      ${list.map(m => `
        <div class="member-row" style="align-items:flex-start;">
          <span style="cursor:pointer;" onclick="openMemberProfileModal('${m.id}')">
            <span class="member-name">${m.name}${m.batch ? ` · ${m.batch}` : ''}${m.role==='admin' ? '<span class="role-badge">플랫폼관리자</span>' : ''}</span>
            ${m.intro ? `<div class="req-sub" style="margin-top:2px;">${m.intro}</div>` : ''}
          </span>
          <span class="member-actions">
            ${admin && currentMember().id !== m.id ? `
              <button class="btn btn-ghost btn-sm" onclick="toggleRole('${m.id}')">${m.role==='admin'?'플랫폼관리자 해제':'플랫폼관리자 지정'}</button>
              ${m.role!=='admin' ? `<button class="btn btn-ghost btn-sm" onclick="toggleWrite('${m.id}')">${m.canWrite?'글쓰기 권한 회수':'글쓰기 권한 부여'}</button>` : ''}
              <button class="btn btn-ghost btn-sm" onclick="adminResetPin('${m.id}')">PIN 재설정</button>
              <button class="btn btn-coral btn-sm" onclick="removeMember('${m.id}')">제외</button>
            ` : ''}
          </span>
        </div>
      `).join('')}
    </div>
  `;
}
function toggleRole(id){
  const m = state.members.find(x=>x.id===id);
  if(!m) return;
  m.role = m.role === 'admin' ? 'member' : 'admin';
  saveMembers();
  renderAll();
}
function removeMember(id){
  state.members = state.members.filter(m => m.id !== id);
  state.meetups.forEach(mt => mt.participants = mt.participants.filter(p => p.memberId !== id));
  saveMembers(); saveMeetups();
  showToast('동문을 제외했어요');
  renderAll();
}

function renderMyTab(){
  const me = currentMember();
  if(!me){
    return `
      <div class="empty" style="padding:40px 16px;">
        <p style="margin:0 0 14px; font-size:14px;">로그인하고 모임에 참여해보세요</p>
        <button class="btn btn-primary" onclick="openAuthModal()">로그인 / 가입</button>
      </div>
    `;
  }

  const incoming = state.requests.filter(r => r.toId === me.id && r.status === 'pending');
  const others = state.members.filter(m => m.id !== me.id);
  const accepted = others.filter(m => contactStateWith(m.id).state === 'accepted');
  const browsable = others.filter(m => !accepted.some(a=>a.id===m.id));
  const myMeetups = state.meetups
    .filter(mt => mt.participants.some(p => p.memberId === me.id))
    .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));

  return `
    <div class="profile-card">
      <p class="profile-name">${me.name}${me.batch ? ` · ${me.batch}` : ''}${me.role==='admin' ? ' 🏅' : ''}</p>
      ${me.intro ? `<p class="profile-phone" style="margin-top:2px;">${me.intro}</p>` : ''}
      <p class="profile-phone">내 연락처: ${maskPhone(me.phone)} (수락한 동문에게만 공개돼요)</p>
      <div class="tag-row">
        <span class="pill">가입일 ${me.joinedAt}</span>
        <span class="pill">${me.role==='admin' ? '플랫폼관리자' : '동문'}</span>
      </div>
    </div>
    <button class="btn btn-ghost btn-block" onclick="openEditProfileModal()">내 정보 수정</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="doLogout()">로그아웃</button>

    ${myMeetups.length ? `
      <div class="section-title">내가 신청한 모임 (${myMeetups.length})</div>
      <div class="card" style="padding:4px 16px;">
        ${myMeetups.map(mt => {
          const st = myStatusIn(mt);
          const isPast = mt.date < ymd(new Date());
          const label = isPast ? '종료' : (st === 'confirmed' ? '확정' : '대기');
          const cls = isPast ? 'badge-past' : (st === 'confirmed' ? 'badge-open' : 'badge-full');
          return `
            <div class="req-row">
              <span><span class="req-name">${mt.title}</span><br><span class="req-sub">${fmtDateKR(mt.date)} · ${mt.time} · ${mt.location}</span></span>
              <span class="badge ${cls}">${label}</span>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}

    ${incoming.length ? `
      <div class="section-title">받은 연락처 요청 (${incoming.length})</div>
      <div class="card" style="padding:4px 16px;">
        ${incoming.map(r => {
          const from = state.members.find(m=>m.id===r.fromId);
          return `<div class="req-row">
            <span><span class="req-name">${from ? from.name + (from.batch ? ' · '+from.batch : '') : '알 수 없음'}</span><br><span class="req-sub">연락처 공개를 요청했어요</span></span>
            <span class="member-actions">
              <button class="btn btn-accent btn-sm" onclick="respondRequest('${r.id}', true)">수락</button>
              <button class="btn btn-ghost btn-sm" onclick="respondRequest('${r.id}', false)">거절</button>
            </span>
          </div>`;
        }).join('')}
      </div>
    ` : ''}

    ${accepted.length ? `
      <div class="section-title">공개된 연락처</div>
      <div class="card" style="padding:4px 16px;">
        ${accepted.map(m => `
          <div class="req-row">
            <span class="req-name">${m.name}${m.batch ? ' · '+m.batch : ''}</span>
            <span class="req-sub">${maskPhone(m.phone)}</span>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div class="section-title">동문 연락처 요청</div>
    <div class="card" style="padding:4px 16px;">
      ${browsable.length === 0 ? `<p class="helper" style="padding:8px 0;">요청할 수 있는 동문이 없어요</p>` :
        browsable.map(m => {
          const cs = contactStateWith(m.id);
          let action;
          if(cs.state === 'sent') action = `<button class="btn btn-ghost btn-sm" disabled>요청됨</button>`;
          else if(cs.state === 'incoming') action = `<button class="btn btn-accent btn-sm" onclick="switchTab('mypage')">받은 요청 확인 ↑</button>`;
          else action = `<button class="btn btn-ghost btn-sm" onclick="requestContact('${m.id}')">연락처 요청</button>`;
          return `<div class="req-row"><span class="req-name">${m.name}${m.batch ? ' · '+m.batch : ''}</span>${action}</div>`;
        }).join('')
      }
    </div>
  `;
}

/* ---------------------------------------------------------
   전체 렌더
--------------------------------------------------------- */
function renderAll(){
  renderSessionChip();
  renderTabs();
  renderApp();
}

init();
</script>
</body>
</html>
